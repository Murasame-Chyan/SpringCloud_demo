server:
  port: 8802

spring:
  application:
    name: eureka-server

eureka:
  instance:
    # 由于不支持多个localhost的Eureka服务器，但是又只有本地测试环境，所以就只能自定义主机名称了
    # 主机名称改为eureka02
    hostname: eureka02
  # 开启之前需要修改一下客户端设置（虽然是服务端
  client:
  # 由于我们是作为服务端角色，所以不需要获取服务端，改为false，默认为true
    fetch-registry: true
    # 暂时不需要将自己也注册到Eureka
    register-with-eureka: true
    # 将eureka服务端指向其他eureka服务器，其中eureka01 & eureka02已在本地hosts指定为localhost
    service-url:
      defaultZone: http://eureka01:8801/eureka